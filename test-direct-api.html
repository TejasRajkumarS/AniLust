<!DOCTYPE html>
<html>

<head>
    <title>Direct AniList API Test</title>
</head>

<body>
    <h1>Testing AniList API Directly</h1>
    <button onclick="testAction()">Test Action Genre</button>
    <button onclick="testAdventure()">Test Adventure Genre</button>
    <pre id="result"></pre>

    <script>
        async function testGenre(genreName) {
            const query = `query ($page: Int, $genre: [String]) { 
                Page(page: $page, perPage: 3) { 
                    media(genre_in: $genre, sort: POPULARITY_DESC, type: ANIME, isAdult: false) { 
                        id 
                        title { english romaji } 
                    } 
                } 
            }`;

            try {
                const response = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        query,
                        variables: { page: 1, genre: [genreName] }
                    }),
                });

                const json = await response.json();
                document.getElementById('result').textContent =
                    `${genreName} Genre:\n` + JSON.stringify(json, null, 2);
                console.log(`${genreName}:`, json);
            } catch (error) {
                document.getElementById('result').textContent =
                    `Error for ${genreName}: ${error.message}`;
            }
        }

        function testAction() {
            testGenre('Action');
        }

        function testAdventure() {
            testGenre('Adventure');
        }
    </script>
</body>

</html>
