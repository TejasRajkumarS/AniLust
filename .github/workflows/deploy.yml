name: Deploy AniLust to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          # Deployed AniLust backend base URL, no trailing slash
          # (e.g. https://anilust-backend.onrender.com).
          # Configure in: Settings → Secrets and variables → Actions →
          # Variables → New repository variable → Name: BACKEND_URL
          # Leave unset to build in direct mode (AniList features only).
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL }}
          # Optional: Gemini key for the AI insight feature. Public by nature
          # (ships in the client bundle) — configure as a repository secret.
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
