<!DOCTYPE html>
<html>

<head>
    <title>Test AniList Genre Query</title>
</head>

<body>
    <h1>Testing AniList Genre API</h1>
    <button onclick="testGenre('Adventure')">Test Adventure</button>
    <button onclick="testGenre('Comedy')">Test Comedy</button>
    <button onclick="testGenre('Action')">Test Action</button>
    <pre id="result"></pre>

    <script>
        async function testGenre(genre) {
            const query = `query ($page: Int, $genre: String) { 
                Page(page: $page, perPage: 20) { 
                    pageInfo { hasNextPage } 
                    media(genre_in: [$genre], sort: POPULARITY_DESC, type: ANIME, isAdult: false) { 
                        id 
                        title { english romaji native } 
                        genres
                    } 
                } 
            }`;

            try {
                const response = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                    },
                    body: JSON.stringify({
                        query,
                        variables: { page: 1, genre }
                    }),
                });

                const json = await response.json();
                document.getElementById('result').textContent = JSON.stringify(json, null, 2);
                console.log('Genre:', genre);
                console.log('Results:', json);
            } catch (error) {
                document.getElementById('result').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>

</html>
